on:
  push:
    branches:
    - main
    - 'develop/**'
jobs:
  my_job:
    runs-on: self-hosted   
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: Show Docker Version
      run: docker --version
    - name: Docker build Gradle
      run: docker build -t myappcompiled:v1 -f Dockerfiles/DockerBuild .
    - name: Copy compiled app.jar
      run: |
        id=$(docker create myappcompiled:v1)
        mkdir -p /tmp/app
        docker cp $id:/app/build/libs/*.jar /tmp/app/app.jar
        docker rm -v $id

