on:
  push:
    branches:
    - main
    - 'develop/**'
jobs:
  my_job:
    runs-on: self-hosted   
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
      
    - name: Show Docker Version
      run: docker --version 
      
    - name: compile App with docker to myapp/compiled image
      run: docker build -t myapp/compiled -f Dockerfiles/DockerfileCompile .

    - name: sonaCubeScanner
      run: | 
       docker run \
       --rm \
       -e SONAR_HOST_URL="${{ SonarQube.url }}" \
       -e SONAR_TOKEN="${{ SonarQube.token }}" \
       -e SONAR_SCANNER_OPTS="-Dsonar.projectKey=${{ SonarQube.key}} \
       -Dsonar.sources=src/main -Dsonar.java.libraries=build/libs -Dsonar.java.binaries=build/classes -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml -Dsonar.junit.reportsPath=build/test-results" \
       -v "${PWD}:/usr/src" \
       sonarsource/sonar-scanner-cli
      
    - name: Create Runnable Dockerimage for Myapp 
      run: docker build -t myapp:v1 -f Dockerfiles/DockerfileRunnable . 
      
    - name: Cleanup Docker image
      run: docker image rm myapp/compiled



      

