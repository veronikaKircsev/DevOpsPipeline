on:
  push:
    branches:
    - main
    - 'develop/**'

env:
  VERSION: "0.0.1"

jobs:
  my_job:
    runs-on: self-hosted   
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
      
    - name: Show Docker Version
      run: docker --version 
      
    - name: compile App with docker to myapp/compiled image
      run: docker build -t myapp/compiled -f Dockerfiles/DockerfileCompile .
      
    - name: sonarQubeScanner
      run: |
       docker container rm myappCompiled || true
       docker create --name myappCompiled  myapp/compiled
       docker cp myappCompiled:app/build/ ./build
       docker run \
       --rm \
       -e SONAR_HOST_URL="${{ vars.URL }}" \
       -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" \
       -e SONAR_SCANNER_OPTS="-Dsonar.projectKey=${{ vars.KEY }} -Dsonar.sources=src/main -Dsonar.java.libraries=build/libs -Dsonar.java.binaries=build/classes -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml -Dsonar.junit.reportsPath=build/test-results" \
       -v "${PWD}:/usr/src" \
       sonarsource/sonar-scanner-cli

    - name: pandocFile
      run: |
        docker run --rm \
        --volume "$(pwd):/data" \
        --user $(id -u):$(id -g) \
        pandoc/latex README.md -o documentation.pdf --pdf-engine=xelatex \
        --standalone --toc --toc-depth=2 --highlight-style=tango

    - name: build Mkdocs html
      run: docker run --rm -it -v ${PWD}:/docs squidfunk/mkdocs-material build

    - name: deploy Mkdocs
      run: docker run --rm -v ~/.ssh:/root/.ssh -v ${PWD}:/docs squidfunk/mkdocs-material gh-deploy

    - name: Create Runnable Dockerimage for Myapp
      run: docker build -t myapp:v1-$VERSION -f Dockerfiles/DockerfileRunnable .

    - name: Tag the Docker image
      run: docker tag myapp:v1-$VERSION 10.0.40.162:5000/team6/myapp:v1-$VERSION

    - name: Push to Registry
      run: docker image push 10.0.40.162:5000/team6/myapp:v1-$VERSION

    - name: Cleanup Docker image
      run: |
       docker container rm myappCompiled
       docker image rm myapp/compiled
