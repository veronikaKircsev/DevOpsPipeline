on:
  push:
    branches:
     - main
     - 'develop/**'
jobs:
  my_job:
    runs-on: self-hosted   
    steps: 
    - name: checkout repo
      uses: action/checkout@v4
    - name: Show Docker Version
      run: docker --version
    - name: Docker build
      run: docker build -t testfile:v1 -f test-docker/dockerFile test-docker
