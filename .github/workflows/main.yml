on:
  push:
    branches:
    - main
    - 'develop/**'
jobs:
  my_job:
    runs-on: self-hosted   
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: Show Docker Version
      run: docker --version
    - name: compile with docker
      run: docker build -t myappcompiled:v1 -f Dockerfiles/DockerBuild .
    - name: Copy compiled app.jar
      run: |
        id=$(docker create myappcompiled:v1)
        mkdir -p ./tmp/app
        docker cp $id:/app/ ./tmp/app
        docker rm -v $id
        pwd
    - name: Create Execute Docker 
      run: docker build -t myapp:v1 -f Dockerfiles/DockerRun .

