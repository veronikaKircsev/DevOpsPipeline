on:
  push:
    branches:
    - main
    - 'develop/**'
jobs:
  my_job:
    runs-on: self-hosted   
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: Show Docker Version
      run: docker --version
    - name: Docker build Gradle
      run: docker build -t testapp:v1 -f Dockerfiles/DockerBuild .
    - name: Create tmp Folder
      run: mkdir -p tmp/app
    - name: Docker copy jar from container
      run: docker cp testapp:/app/build/libs/*.jar /tmp/app/app.jar
    - name: Docker build run container
      run: docker build -t testapp:v1 -f Dockerfiles/DockerRun .
