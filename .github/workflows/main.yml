on:
  push:
    branches:
    - main
    - 'develop/**'

env:
  VERSION: '0.0.1'

jobs:
  my_job:
    runs-on: self-hosted   
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
      
    - name: Show Docker Version
      run: docker --version 

    - name: compile App with docker to myapp/compiled image
      run: docker build -t myapp/compiled -f Dockerfiles/DockerfileCompile .

    - name: sonarQubeScanner
      run: |
       docker container rm myappCompiled || true
       docker create --name myappCompiled  myapp/compiled
       docker cp myappCompiled:app/build/ ./build
       docker run \
       --rm \
       -e SONAR_HOST_URL="${{ vars.URL }}" \
       -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" \
       -e SONAR_SCANNER_OPTS="-Dsonar.projectKey=${{ vars.KEY }} -Dsonar.sources=src/main -Dsonar.java.libraries=build/libs -Dsonar.java.binaries=build/classes -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml -Dsonar.junit.reportsPath=build/test-results" \
       -v "${PWD}:/usr/src" \
       sonarsource/sonar-scanner-cli

    - name: pandocFile
      run: |
        docker run --rm \
        --volume "$(pwd):/data" \
        --user $(id -u):$(id -g) \
        pandoc/latex docs/README.md -o "documentation.pdf" --pdf-engine=xelatex \
        --standalone --toc --toc-depth=2 --highlight-style=tango
        docker run --rm \
        -v "${PWD}:/data" \
        -u $(id -u):$(id -g) \
        pandoc/extra docs/README.md -o "src/main/resources/static/documentation.pdf" \
        --standalone --toc --toc-depth=2 --highlight-style=tango

    - name: build Mkdocs html
      run: docker run --rm -v "$(pwd):/docs" -u $(id -u):$(id -g) squidfunk/mkdocs-material build

    - name: nginx
      run: docker build -t mydoc -f Dockerfiles/DockerfileNGINX .

    - name: Create Runnable Dockerimage for Myapp
      run: docker build -f Dockerfiles/DockerfileRunnable -t myapp .

    - name: Tag the Docker image
      run: |
        docker image tag myapp 10.0.40.162:5000/team6/myapp:${{ env.VERSION }}
        docker image tag mydoc 10.0.40.162:5000/team6/mydoc:${{ env.VERSION }}

    - name: Push to Registry
      run: |
        docker image push 10.0.40.162:5000/team6/myapp:${{ env.VERSION }}
        docker image push 10.0.40.162:5000/team6/mydoc:${{ env.VERSION }}

    - name: Deploy on production server
      run: |
        ssh -i "${{ secrets.PROD_SERVER_SSH_KEY }}" -o StrictHostKeyChecking=no team6@10.0.40.163 '
         ls
        '

    - name: Cleanup Docker image
      run: |
       docker container rm myappCompiled || true
       docker image rm myapp/compiled || true
       docker container prune -f
       docker image prune -af

      

