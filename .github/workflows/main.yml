on:
  push:
    branches:
    - main
    - 'develop/**'
jobs:
  my_job:
    runs-on: self-hosted   
    steps:
    - uses: actions/checkout@v4
    - name: Check contents
      run: ls -al
    - name: Test
      run: |
        cd docker-demo
        docker build -t sampleapp:v1 .
        docker run -p 8080:80 sampleapp:v1
