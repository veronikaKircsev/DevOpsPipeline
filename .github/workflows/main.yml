on:
  push:
    branches:
    - main
    - 'develop/**'
jobs:
  my_job:
    runs-on: self-hosted   
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: Show Docker Version
      run: docker --version
    - name: compile with docker
      run: docker build -t myapp/compiled -f Dockerfiles/DockerBuild .
    - name: Create Execute Docker 
      run: docker build -t myapp:v1 -f Dockerfiles/DockerRun .
    - name: Docker Cleanup
      run: docker images rm myapp/compiled


      

